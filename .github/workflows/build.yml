name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Constellation-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Constellation-${{ github.run_number }}
          path: Constellation-${{ github.run_number }}.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Constellation build ${{ github.run_number }}
          body: Download the APK below and install it on your phone. Updates install over the previous version and keep your thoughts.
          files: Constellation-${{ github.run_number }}.apk
          make_latest: true
